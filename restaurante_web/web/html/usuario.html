<div class="container mt-4">

    <!-- FORMULARIO -->
    <div class="row">
        <div class="col-12">

            <div class="card shadow-lg border-0 card-mx">

                <div class="card-header header-mx-orange text-white fw-bold">
                    <i class="bi bi-person-gear"></i> Administrar Usuarios
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <!-- IZQUIERDA -->
                        <div class="col-md-6">
                            <div class="card p-3 shadow-sm subcard-mx">

                                <label class="form-label fw-bold">ID</label>
                                <input type="number" id="txtIdUsuario" class="form-control input-mx" readonly>

                                <label class="form-label mt-3 fw-bold">Nombre</label>
                                <input type="text" id="txtNombreUsuario" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Apellido Paterno</label>
                                <input type="text" id="txtApellidoP" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Apellido Materno</label>
                                <input type="text" id="txtApellidoM" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Teléfono</label>
                                <input type="text" id="txtTelefonoUsuario" class="form-control input-mx">

                            </div>
                        </div>

                        <!-- DERECHA -->
                        <div class="col-md-6">
                            <div class="card p-3 shadow-sm subcard-mx">

                                <label class="form-label fw-bold">Correo</label>
                                <input type="text" id="txtCorreoUsuario" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Usuario</label>
                                <input type="text" id="txtUserUsuario" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Contraseña</label>
                                <input type="password" id="txtContraUsuario" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Rol</label>
                                <select id="txtRolUsuario" class="form-select input-mx">
                                    <option value="Administrador">Administrador</option>
                                    <option value="Mesero">Mesero</option>
                                    <option value="Cajero">Cajero</option>
                                </select>

                                <label class="form-label mt-3 fw-bold">Activo</label>
                                <select id="txtActivoUsuario" class="form-select input-mx">
                                    <option value="1">Activo</option>
                                    <option value="0">Inactivo</option>
                                </select>

                            </div>
                        </div>

                    </div>

                    <!-- BOTONES -->
                    <div class="row mt-4">

                        <div class="col-md-4">
                            <button class="btn btn-success-mx w-100" onclick="almacenarUsuario()">
                                <i class="bi bi-plus-circle"></i> Agregar
                            </button>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-warning-mx w-100" onclick="modificarUsuario()">
                                <i class="bi bi-pencil-square"></i> Modificar
                            </button>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-danger-mx w-100" onclick="cancelarUsuario()">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- TABLA -->
    <div class="row mt-4">
        <div class="col-12">

            <div class="card shadow-lg border-0 card-mx">

                <div class="card-header header-mx-blue text-white fw-bold">
                    <i class="bi bi-people"></i> Lista de Usuarios
                </div>

                <div class="card-body p-0" style="max-height:350px; overflow-y:auto;">
                    <table class="table table-striped table-hover m-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellidos</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Activo</th>
                                <th>Seleccionar</th>
                                <th>Eliminar</th>
                            </tr>
                        </thead>

                        <tbody id="tbUsuario"></tbody>

                    </table>
                </div>

            </div>

        </div>
    </div>

</div>
