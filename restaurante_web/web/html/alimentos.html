<div class="container mt-4">

    <!-- FORMULARIO -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-lg border-0 card-mx">

                <div class="card-header header-mx-green text-white fw-bold">
                    <i class="bi bi-basket"></i> Editar Alimento
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <!-- Columna izquierda -->
                        <div class="col-md-6">
                            <div class="card p-3 shadow-sm subcard-mx">

                                <label class="form-label fw-bold">ID</label>
                                <input type="number" id="txtIdAlim" class="form-control input-mx" readonly>

                                <label class="form-label mt-3 fw-bold">Nombre</label>
                                <input type="text" id="txtNombreAlim" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Descripción</label>
                                <input type="text" id="txtDescripcionAlim" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Foto</label>
                                <input type="file" id="txtFotoAlim" class="form-control input-mx">

                            </div>
                        </div>

                        <!-- Columna derecha -->
                        <div class="col-md-6">
                            <div class="card p-3 shadow-sm subcard-mx">

                                <label class="form-label fw-bold">Precio</label>
                                <input type="number" id="txtPrecioAlim" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Categoría</label>
                                <input type="text" id="txtCategoriaAlim" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Activo</label>
                                <select id="txtActivoAlim" class="form-select input-mx">
                                    <option value="1">Activo</option>
                                    <option value="0">Inactivo</option>
                                </select>

                            </div>
                        </div>

                    </div>

                    <!-- BOTONES -->
                    <div class="row mt-4">

                        <div class="col-md-4">
                            <button class="btn btn-success-mx w-100" onclick="almacenarAlimento()">
                                <i class="bi bi-plus-circle"></i> Agregar
                            </button>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-warning-mx w-100" onclick="modificarAlimento()">
                                <i class="bi bi-pencil-square"></i> Modificar
                            </button>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-danger-mx w-100" onclick="cancelarAlimento()">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </button>
                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- TABLA -->
    <div class="row mt-4">
        <div class="col-12">

            <div class="card shadow-lg border-0 card-mx">
                <div class="card-header header-mx-blue text-white fw-bold">
                    <i class="bi bi-list-ul"></i> Lista de Alimentos
                </div>

                <div class="card-body p-0" style="max-height:350px; overflow-y:auto;">
                    <table class="table table-striped table-hover m-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Foto</th>
                                <th>Precio</th>
                                <th>Categoría</th>
                                <th>Activo</th>
                                <th>Seleccionar</th>
                                <th>Eliminar</th>
                            </tr>
                        </thead>

                        <tbody id="tbalimento"></tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>

</div>
