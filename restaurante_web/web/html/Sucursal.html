<div class="container mt-4">

    <!-- FORMULARIO -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-lg border-0 card-mx">

                <div class="card-header header-mx-green text-white fw-bold">
                    <i class="bi bi-building"></i> Editar Sucursal
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <!-- Columna izquierda -->
                        <div class="col-md-6">
                            <div class="card p-3 shadow-sm subcard-mx">

                                <label class="form-label fw-bold">ID</label>
                                <input type="number" id="txtIdSuc" class="form-control input-mx" readonly>

                                <label class="form-label mt-3 fw-bold">Nombre</label>
                                <input type="text" id="txtNombreSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Latitud</label>
                                <input type="text" id="txtLatitudSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Longitud</label>
                                <input type="text" id="txtLongitudSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Foto</label>
                                <input type="file" id="txtRutaFotoSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">URL WEB</label>
                                <input type="text" id="txtURLSuc" class="form-control input-mx">

                            </div>
                        </div>

                        <!-- Columna derecha -->
                        <div class="col-md-6">
                            <div class="card p-3 shadow-sm subcard-mx">

                                <label class="form-label fw-bold">Horarios</label>
                                <input type="text" id="txtHorariosSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Calle</label>
                                <input type="text" id="txtCalleSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Número</label>
                                <input type="text" id="txtNumeroSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Colonia</label>
                                <input type="text" id="txtColoniaSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Estado</label>
                                <input type="text" id="txtEstadoSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Ciudad</label>
                                <input type="text" id="txtCiudadSuc" class="form-control input-mx">

                                <label class="form-label mt-3 fw-bold">Activo</label>
                                <select id="txtActivoSuc" class="form-select input-mx">
                                    <option value="1">Activo</option>
                                    <option value="0">Inactivo</option>
                                </select>

                            </div>
                        </div>
                    </div>

                    <!-- BOTONES -->
                    <div class="row mt-4">

                        <div class="col-md-4">
                            <button class="btn btn-success-mx w-100" onclick="almacenarSuc()">
                                <i class="bi bi-plus-circle"></i> Agregar
                            </button>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-warning-mx w-100" onclick="modificarSuc()">
                                <i class="bi bi-pencil-square"></i> Modificar
                            </button>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-danger-mx w-100" onclick="cancelarSuc()">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </button>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- TABLA -->
    <div class="row mt-4">
        <div class="col-12">

            <div class="card shadow-lg border-0 card-mx">
                <div class="card-header header-mx-blue text-white fw-bold">
                    <i class="bi bi-list-ul"></i> Lista de Sucursales
                </div>

                <div class="card-body p-0" style="max-height:350px; overflow-y:auto;">
                    <table class="table table-striped table-hover m-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Latitud</th>
                                <th>Longitud</th>
                                <th>Foto</th>
                                <th>URL WEB</th>
                                <th>Horarios</th>
                                <th>Calle</th>
                                <th>Número</th>
                                <th>Colonia</th>
                                <th>Ciudad</th>
                                <th>Estado</th>
                                <th>Activo</th>
                                <th>Seleccionar</th>
                                <th>Eliminar</th>
                            </tr>
                        </thead>

                        <tbody id="tbsucursal"></tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>

</div>
