<!DOCTYPE html>
<html lang="es">

<head>
    <title>Restaurante El Zarape</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos mexicanos -->
    <link href="css/styles.css" rel="stylesheet">

</head>

<body class="bg-mx">

<nav class="navbar navbar-expand-lg navbar-dark nav-mx shadow">
    <div class="container">

        <a class="navbar-brand fw-bold text-white" href="principal.html">
            <i class="bi bi-shop"></i> El Zarape
        </a>

        <ul class="navbar-nav ms-auto">

            <li class="nav-item">
                <a class="nav-link nav-link-mx">Alimentos</a>
            </li>

            <li class="nav-item">
                <a class="nav-link nav-link-mx">Bebidas</a>
            </li>

            <li class="nav-item">
                <a class="nav-link nav-link-mx">Combos</a>
            </li>

            <li class="nav-item">
                <a class="nav-link nav-link-mx" onclick="cargacursal()">
                    <i class="bi bi-building"></i> Sucursal
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link nav-link-mx" onclick="cargarusuario()">
                    <i class="bi bi-people"></i> Usuario
                </a>
            </li>

        </ul>

    </div>
</nav>

<section id="contenido" class="container mt-4">

    <div id="carruselZarape" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" class="active" data-bs-target="#carruselZarape" data-bs-slide-to="0"></button>
            <button type="button" data-bs-target="#carruselZarape" data-bs-slide-to="1"></button>
        </div>

        <div class="carousel-inner rounded shadow-lg">

            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092" class="d-block w-100">
                <div class="carousel-caption">
                    <h5 class="fw-bold shadow-text">Tacos al estilo de la casa</h5>
                    <p class="shadow-text">Tradición con sabor mexicano.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1556910103-1c02745aae4d" class="d-block w-100">
                <div class="carousel-caption">
                    <h5 class="fw-bold shadow-text">Bebidas refrescantes</h5>
                    <p class="shadow-text">Perfectas para acompañar tus alimentos.</p>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carruselZarape" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carruselZarape" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

</section>

<footer class="footer-mx text-center p-3 text-white mt-4">
    © 2025 El Zarape
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/sucursal.js"></script>
<script src="js/usuario.js"></script>

</body>
</html>
