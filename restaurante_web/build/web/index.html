<!DOCTYPE html>
<html lang="es">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link href="css/styles.css" rel="stylesheet">

</head>

<body class="bg-login d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow login-card p-4">
        <h3 class="text-center mb-4 text-primary-mx">
            <i class="bi bi-person-circle"></i> Acceso
        </h3>

        <div class="mb-3">
            <label for="txtUsuarioLog" class="form-label fw-bold">Usuario</label>
            <input type="text" id="txtUsuarioLog" class="form-control input-mx">
        </div>

        <div class="mb-3">
            <label for="txtContraLog" class="form-label fw-bold">Contraseña</label>
            <input type="password" id="txtContraLog" class="form-control input-mx">
        </div>

        <button class="btn btn-primary-mx w-100 mt-2" onclick="validarAcceso()">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
    </div>

    <script src="js/acceso.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
